[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-toolkit"
version = "0.1.0"
description = "Reusable tools for data science and AI workflows."
requires-python = ">=3.10"
dependencies = [
    "pandas"
]

[project.scripts]
ai_data_toolkit = "ai_data_toolkit.statistics_cli:main"

[tool.setuptools.packages.find]
include = ["ai_data_toolkit*"]